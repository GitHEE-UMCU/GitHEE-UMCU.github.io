name: "RShiny SEE Scaffold — Haemophilia A"
description: "Configurable RShiny scaffold for MRC-compliant Structured Expert Elicitation; first use case elicits P(joint surgery) at HJHS cutpoints for haemophilia A."

analysis_type: [SEE]        # cost-effectiveness | budget-impact | burden-of-disease | epidemiology | literature-review | data-pipeline | utility | SEE
methods: [other]            # markov | decision-tree | survival | regression | descriptive | other
language: [R]               # R | Python | Stata | Excel | mixed

elicitation_methods: [chips-and-bins, quartiles, tertiles]
deployment: shinyapps.io
protocol: "MRC-SEE (Bojke et al. 2022) / STEER (Jankovic et al. 2022)"
config_file: manual_inputs.R   # single file researchers edit to adapt scaffold

