name: Rebuild and deploy docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install mkdocs-material mkdocs-awesome-pages-plugin pyyaml

      - name: Generate repository index
        run: python generate_index.py

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
